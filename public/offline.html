<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
    <title>Sin conexión · Gestor de cartera</title>
    <link rel="icon" href="/icons/neutral/favicon.svg" type="image/svg+xml">
    <!--
        Page the service worker (public/sw.js) shows when a page cannot load
        without a connection. It is self-contained: inline styles with the
        neutral ryr-design tokens, no external files and no data.
    -->
    <style>
        :root {
            color-scheme: light dark;
            --ground: #f5f5f2;
            --surface: #ffffff;
            --line: #e5e5e0;
            --fg: #17191c;
            --fg-soft: #45484e;
            --tile: #17191c;
            --on-tile: #ffffff;
            --button: #17191c;
            --on-button: #ffffff;
            --maintenance: #7a4f00;
            --maintenance-bg: #fff4db;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --ground: #121315;
                --surface: #1c1d20;
                --line: #2c2e33;
                --fg: #f2f2ef;
                --fg-soft: #c9cbd0;
                --maintenance: #f5d58a;
                --maintenance-bg: #2a2418;
                --tile: #f2f2ef;
                --on-tile: #121315;
                --button: #f2f2ef;
                --on-button: #121315;
            }
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            display: flex;
            min-height: 100dvh;
            margin: 0;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
            background: var(--ground);
            color: var(--fg);
            font-family: Helvetica, Arial, 'Helvetica Neue', sans-serif;
            font-size: 1rem;
            line-height: 1.5;
        }

        main {
            width: 100%;
            max-width: 28rem;
            padding: 2rem 1.5rem;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
        }

        .tile {
            display: grid;
            width: 3rem;
            height: 3rem;
            place-items: center;
            border-radius: 14px;
            background: var(--tile);
            color: var(--on-tile);
        }

        .tile svg {
            width: 1.75rem;
            height: 1.75rem;
        }

        .status {
            display: inline-flex;
            margin: 1.5rem 0 0.75rem;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.625rem;
            border-radius: 8px;
            background: var(--maintenance-bg);
            color: var(--maintenance);
            font-size: 0.8125rem;
            font-weight: 600;
        }

        .status svg {
            width: 1.125rem;
            height: 1.125rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-family: Helvetica, Arial, 'Helvetica Neue', sans-serif;
            font-size: 1.75rem;
            line-height: 1.1;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0 0 1rem;
            color: var(--fg-soft);
        }

        button {
            display: inline-flex;
            width: 100%;
            min-height: 2.75rem;
            margin-top: 0.5rem;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border: 0;
            border-radius: 12px;
            background: var(--button);
            color: var(--on-button);
            font: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
        }

        :focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <span class="tile" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7V5.5A1.5 1.5 0 0 0 15.5 4h-10A2 2 0 0 0 3.5 6"/><path d="M3.5 6v12a2 2 0 0 0 2 2h13a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 18.5 7h-13a2 2 0 0 1-2-1"/><path d="M20 11.5h-3.5a1.75 1.75 0 0 0 0 3.5H20"/></svg>
        </span>

        <p class="status" role="status">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19.5h.01"/><path d="M8.8 16a4.5 4.5 0 0 1 6.4 0"/><path d="M5.5 12.6a9 9 0 0 1 4-2.3"/><path d="M18.5 12.6a9 9 0 0 0-1.9-1.3"/><path d="M2.5 9.2a13.5 13.5 0 0 1 3.9-2.5"/><path d="M21.5 9.2A13.5 13.5 0 0 0 11 5.6"/><path d="m3.5 3.5 17 17"/></svg>
            Sin conexión
        </p>

        <h1>No pudimos abrir esta página</h1>
        <p>Revisa tu conexión a internet. Cuando vuelva, la página se recarga sola.</p>
        <p>El gestor de cartera no guarda datos en tu dispositivo: necesitas conexión para ver tus clientes.</p>

        <button type="button" id="reintentar">Reintentar</button>
    </main>

    <script>
        document.getElementById('reintentar').addEventListener('click', () => window.location.reload());
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
