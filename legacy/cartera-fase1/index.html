<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartera">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Cartera R&amp;R</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --sgx:#F26522; --sdc:#0B5FA5; --grp:#7E57C2; --brand:var(--sgx);
  --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --line:#2a2f3a;
  --tx:#e8eaf0; --tx2:#9aa1af; --ok:#2ecc71; --warn:#f1c40f; --bad:#e74c3c;
  --r:14px; font-size:15px;
}
:root[data-theme="light"]{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#edf0f5; --line:#dde2ea;
  --tx:#1c2230; --tx2:#5c6575; --ok:#1e9e55; --warn:#b8860b; --bad:#cf3a2b;
}
:root[data-theme="light"] .card{box-shadow:0 1px 3px rgba(20,30,60,.06)}
:root[data-theme="light"] .kcard{box-shadow:0 1px 2px rgba(20,30,60,.05)}
*{box-sizing:border-box; margin:0}
body{background:var(--bg); color:var(--tx); font-family:'Manrope',system-ui,sans-serif; min-height:100vh}
h1,h2,h3,.brandfont{font-family:'Outfit',sans-serif; letter-spacing:-.02em}
button{font-family:inherit; cursor:pointer; border:none; border-radius:10px}
input,select,textarea{font-family:inherit; font-size:14px; background:var(--panel2); color:var(--tx); border:1px solid var(--line); border-radius:10px; padding:9px 12px; width:100%}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand)}
a{color:var(--brand)}
.hidden{display:none!important}

/* ---- Login ---- */
#login{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px}
#login .card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:36px 32px; width:100%; max-width:380px}
.diamond{width:38px;height:38px; background:linear-gradient(135deg,var(--sgx),var(--sdc)); transform:rotate(45deg); border-radius:8px; margin:0 auto 18px}
#login h1{text-align:center; font-size:24px; margin-bottom:4px}
#login p.sub{text-align:center; color:var(--tx2); font-size:13px; margin-bottom:24px}
#login label{font-size:12px; color:var(--tx2); display:block; margin:12px 0 5px}
#login button{width:100%; margin-top:20px; padding:12px; background:var(--brand); color:#fff; font-weight:600; font-size:15px}
.err{color:var(--bad); font-size:13px; margin-top:12px; text-align:center; min-height:18px}

/* ---- Shell ---- */
#app{max-width:1440px; margin:0 auto; padding:0 18px 60px}
header{display:flex; align-items:center; gap:16px; padding:16px 0; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px}
.logo .diamond{width:26px;height:26px; margin:0; border-radius:6px}
.logo b{font-family:'Outfit',sans-serif; font-size:19px; letter-spacing:-.02em}
.emp-tabs{display:flex; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px}
.emp-tabs button{background:transparent; color:var(--tx2); padding:8px 18px; font-weight:700; font-size:14px}
.emp-tabs button.on{background:var(--brand); color:#fff}
nav{display:flex; gap:4px; margin-left:auto; flex-wrap:wrap}
nav button{background:transparent; color:var(--tx2); padding:9px 14px; font-weight:600; font-size:14px}
nav button.on{background:var(--panel); color:var(--tx); border:1px solid var(--line)}
.userchip{display:flex; align-items:center; gap:8px; color:var(--tx2); font-size:13px}
.userchip .av{width:30px;height:30px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px}

/* ---- Common ---- */
.grid{display:grid; gap:14px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.kpi .lbl{color:var(--tx2); font-size:12px; text-transform:uppercase; letter-spacing:.06em}
.kpi .val{font-family:'Outfit',sans-serif; font-size:26px; font-weight:700; margin-top:6px}
.kpi .sub{color:var(--tx2); font-size:12px; margin-top:4px}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{color:var(--tx2); font-weight:600; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:12px; text-transform:uppercase; letter-spacing:.04em}
th.sortable{cursor:pointer; user-select:none; white-space:nowrap}
th.sortable:hover{color:var(--tx)}
td{padding:9px 10px; border-bottom:1px solid var(--line)}
tr:hover td{background:var(--panel2)}
.num{text-align:right; font-variant-numeric:tabular-nums}
.pill{display:inline-block; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:600}
.btn{background:var(--brand); color:#fff; padding:10px 16px; font-weight:600; font-size:14px}
.btn2{background:var(--panel2); color:var(--tx); border:1px solid var(--line); padding:9px 14px; font-weight:600; font-size:13.5px}
.mini{padding:6px 10px; font-size:12.5px}
.sec-title{font-size:16px; margin-bottom:12px}
.muted{color:var(--tx2)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* ---- Kanban ---- */
#kanban-wrap{overflow-x:auto; padding-bottom:14px}
#kanban{display:flex; gap:12px; align-items:flex-start; min-width:min-content}
.kcol{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); width:272px; flex:0 0 272px; max-height:74vh; display:flex; flex-direction:column}
.kcol h3{font-size:13.5px; padding:12px 14px 8px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0}
.kcol h3 .cnt{color:var(--tx2); font-size:12px; font-weight:600}
.kcol .kbody{padding:6px 8px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; min-height:60px}
.kcol.dragover{outline:2px dashed var(--brand); outline-offset:-4px}
.kcard{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--brand); border-radius:10px; padding:10px 12px; cursor:grab; font-size:13px}
.kcard b{display:block; font-size:13px; line-height:1.25; margin-bottom:5px}
.kcard .m{display:flex; justify-content:space-between; color:var(--tx2); font-size:12px; margin-top:3px}
.kcard .chip{margin-top:6px; font-size:11px; padding:2px 8px; border-radius:99px; display:inline-block}
.dias-bad{color:var(--bad); font-weight:700}
.dias-ok{color:var(--ok)}

/* ---- Modal ---- */
#modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; justify-content:flex-end; z-index:50}
#modal{background:var(--bg); border-left:1px solid var(--line); width:min(780px,100%); height:100%; overflow-y:auto; padding:24px}
#modal .close{float:right; background:var(--panel2); color:var(--tx); width:34px; height:34px; border-radius:50%; font-size:16px}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0}
.timeline{display:flex; flex-direction:column; gap:10px; margin-top:10px}
.tl-item{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:13px}
.tl-item .head{display:flex; justify-content:space-between; color:var(--tx2); font-size:12px; margin-bottom:4px}
.tl-item.sistema{opacity:.65}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.formgrid .full{grid-column:1/-1}
label.f{font-size:12px; color:var(--tx2); display:block; margin-bottom:4px}

/* ---- Aging bar ---- */
.aging{display:flex; height:14px; border-radius:99px; overflow:hidden; background:var(--panel2); margin-top:10px}
.aging div{height:100%}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--tx2)}
.dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px}

/* ---- Upload ---- */
.dropzone{border:2px dashed var(--line); border-radius:var(--r); padding:36px; text-align:center; color:var(--tx2); cursor:pointer}
.dropzone.on{border-color:var(--brand); color:var(--tx)}
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 20px; font-size:14px; z-index:99; box-shadow:0 8px 30px rgba(0,0,0,.5)}
@media (max-width:760px){ .formgrid{grid-template-columns:1fr} }

/* ===== capa moderna e interactiva ===== */
*{-webkit-tap-highlight-color:transparent}
button{transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .2s,background .2s,opacity .2s,box-shadow .2s}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.95)}
.card{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s}
.card:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 16px 38px rgba(0,0,0,.28),0 4px 14px color-mix(in srgb,var(--brand) 18%,transparent);border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}
.mcard{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.mcard:active{transform:scale(.98)}
.kcard{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.kcard:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px rgba(0,0,0,.32)}
.kpi{position:relative;overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--brand) 10%,var(--panel)),var(--panel) 58%)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sgx),var(--sdc));border-radius:3px 3px 0 0}
.kpi .val{font-family:'Outfit',sans-serif;letter-spacing:-.03em}
#view{animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#view .grid>.card{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
#view .grid>.card:nth-child(1){animation-delay:.04s}
#view .grid>.card:nth-child(2){animation-delay:.09s}
#view .grid>.card:nth-child(3){animation-delay:.14s}
#view .grid>.card:nth-child(4){animation-delay:.19s}
#view .grid>.card:nth-child(5){animation-delay:.24s}
#view .grid>.card:nth-child(6){animation-delay:.29s}
.kcol{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) backwards}
.kcol:nth-child(1){animation-delay:.04s}.kcol:nth-child(2){animation-delay:.09s}.kcol:nth-child(3){animation-delay:.14s}.kcol:nth-child(4){animation-delay:.19s}.kcol:nth-child(5){animation-delay:.24s}.kcol:nth-child(6){animation-delay:.29s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
#toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
#modal{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(48px);opacity:.3}to{transform:none;opacity:1}}
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent)}
.btn{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 80%,#fff),var(--brand));box-shadow:0 3px 14px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn:hover{box-shadow:0 6px 20px color-mix(in srgb,var(--brand) 50%,transparent)}
.emp-tabs button.on{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 80%,#fff),var(--brand))}
.kcol h3{background:var(--panel);z-index:2}
.kcard .move{float:right;background:transparent;color:var(--tx2);font-size:16px;padding:2px 6px;line-height:1;margin:-2px -4px 0 6px}
#sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:min(480px,100%);padding:18px 18px max(18px,env(safe-area-inset-bottom));animation:sheetUp .25s ease}
@keyframes sheetUp{from{transform:translateY(40%)}to{transform:none}}
#sheet .est{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--tx);padding:12px 14px;margin-top:8px;font-size:14px;font-weight:600}
#bottomnav{display:none}
.mob-only{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.mcard .m{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-top:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){
  :root{font-size:14px}
  #app{padding:0 12px 90px}
  header{gap:10px;padding:10px 0}
  nav{display:none}
  .userchip{margin-left:auto}
  .emp-tabs{width:100%;order:5}
  .emp-tabs button{flex:1}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:45;justify-content:space-around;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #bottomnav button{background:none;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:4px 8px;border-radius:12px}
  #bottomnav button.on{color:var(--brand)}
  #bottomnav .ic{font-size:19px}
  #kanban-wrap{margin:0 -12px;padding:0 12px 14px}
  #kanban{scroll-snap-type:x mandatory}
  .kcol{width:84vw;flex:0 0 84vw;scroll-snap-align:center;max-height:64vh}
  .desk-only{display:none!important}
  .mob-only{display:block}
  .grid{grid-template-columns:1fr!important}
  #modal{width:100%;padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .acts .btn,.acts .btn2{flex:1 1 44%}
  h2{font-size:19px}
  input,select,textarea{font-size:16px}
}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="diamond"></div>
    <h1>Cartera R&amp;R</h1>
    <p class="sub">Seguimiento de cuentas por cobrar · Segurex &amp; SDC</p>
    <label>Correo</label><input id="l-email" type="email" autocomplete="username">
    <label>Contraseña</label><input id="l-pass" type="password" autocomplete="current-password">
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo"><div class="diamond"></div><b>Cartera R&amp;R</b></div>
    <div class="emp-tabs" id="emp-tabs"></div>
    <nav id="nav"></nav>
    <div class="userchip"><div class="av" id="u-av"></div><span id="u-name"></span>
      <button class="btn2 mini" id="theme-btn" onclick="toggleTheme()" title="Modo claro / oscuro">🌙</button>
      <button class="btn2 mini" onclick="openPass()">Clave</button>
      <button class="btn2 mini" onclick="logout()">Salir</button></div>
  </header>
  <div id="view"></div>
</div>

<div id="bottomnav"></div>
<div id="sheet-bg" class="hidden" onclick="if(event.target===this)this.classList.add('hidden')"><div id="sheet"></div></div>
<div id="modal-bg" class="hidden" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>
<div id="toast" class="hidden"></div>

<script>
const API='api.php';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let S={token:LS.get('crr_token')||'', user:null, clients:[], uploads:[], users:[], recent:[], payments:[], hoy:'', emp:LS.get('crr_emp')||'SGX', view:'dashboard', showQuiet:false};
const EMP_META={SGX:{nombre:'Segurex LATAM', color:'var(--sgx)', hex:'#F26522'}, SDC:{nombre:'Soluciones y Derivados', color:'var(--sdc)', hex:'#0B5FA5'}, GRP:{nombre:'Grupo R&R — Consolidado', color:'var(--grp)', hex:'#7E57C2'}};
const empChip=e=>`<span class="pill" style="background:${EMP_META[e].hex}22;color:${EMP_META[e].hex};font-size:10px;padding:1px 7px">${e}</span>`;
// --- tema claro / oscuro ---
function applyTheme(){const t=LS.get('crr_theme')||'dark';document.documentElement.dataset.theme=t;const b=document.getElementById('theme-btn');if(b)b.textContent=t==='dark'?'🌙':'☀️';}
function toggleTheme(){LS.set('crr_theme',(LS.get('crr_theme')||'dark')==='dark'?'light':'dark');applyTheme();}
applyTheme();
const ESTADOS=[
 {k:'al_dia', t:'Al día', c:'#2ecc71', quiet:true},
 {k:'por_vencer', t:'Por vencer', c:'#f1c40f'},
 {k:'vencida', t:'Vencida', c:'#e74c3c'},
 {k:'en_gestion', t:'En gestión', c:'#3498db'},
 {k:'compromiso', t:'Compromiso de pago', c:'#9b59b6'},
 {k:'incumplido', t:'Incumplido', c:'#e67e22'},
 {k:'pago_recibido', t:'Pago recibido', c:'#1abc9c', quiet:true},
 {k:'juridico', t:'Jurídico', c:'#95a5a6'}];
const EST=k=>ESTADOS.find(e=>e.k===k)||ESTADOS[0];
const $=id=>document.getElementById(id);
const money=v=>'$ '+Math.round(+v||0).toLocaleString('es-CO');
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=d=>d?d.toString().substring(0,10):'—';

function toast(msg,ok=true){const t=$('toast');t.textContent=msg;t.style.borderColor=ok?'var(--ok)':'var(--bad)';t.classList.remove('hidden');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('hidden'),3500);}
async function api(action,opts={}){
  const o={headers:{'X-Auth':S.token},...opts};
  if(o.json){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.json);delete o.json;}
  const r=await fetch(API+'?action='+action+(opts.qs||''),o);
  const d=await r.json().catch(()=>({ok:false,error:'Respuesta inválida del servidor'}));
  if(r.status===401){logout(false);throw new Error(d.error||'Sesión vencida');}
  if(!d.ok)throw new Error(d.error||'Error');
  return d;
}

// ---------- Sesión ----------
async function doLogin(){
  $('l-err').textContent='';
  try{
    const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('l-email').value,pass:$('l-pass').value})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error);
    S.token=d.token;LS.set('crr_token',d.token);
    await boot();
  }catch(e){$('l-err').textContent=e.message;}
}
$('l-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
function logout(clear=true){if(clear)LS.del('crr_token');S.token='';$('app').classList.add('hidden');$('login').classList.remove('hidden');}

async function boot(){
  const d=await api('state');
  S.user=d.user;S.clients=d.clients;S.uploads=d.uploads;S.users=d.users;S.recent=d.recent;S.hoy=d.hoy;S.sync=d.sync||{};S.payments=d.payments||[];
  if(S.user.empresa!=='ALL'&&S.user.rol!=='admin')S.emp=S.user.empresa;
  if(!['SGX','SDC','GRP'].includes(S.emp))S.emp='SGX';
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('u-name').textContent=S.user.nombre.split(' ')[0];
  $('u-av').textContent=S.user.nombre.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  render();
}
async function refresh(){const d=await api('state');S.clients=d.clients;S.uploads=d.uploads;S.users=d.users;S.recent=d.recent;S.hoy=d.hoy;S.sync=d.sync||{};S.payments=d.payments||[];render();}

// ---------- Render shell ----------
function render(){
  applyTheme();
  document.documentElement.style.setProperty('--brand',EMP_META[S.emp].color);
  const canBoth=S.user.rol==='admin'||S.user.empresa==='ALL';
  if(S.emp==='GRP'&&!canBoth)S.emp=S.user.empresa;
  const tabs=canBoth?['SGX','SDC','GRP']:['SGX','SDC'];
  $('emp-tabs').innerHTML=tabs.map(e=>{
    const dis=!canBoth&&S.user.empresa!==e;
    return `<button class="${S.emp===e?'on':''}" ${dis?'disabled style="opacity:.35"':''} onclick="setEmp('${e}')">${e==='GRP'?'◆ GRUPO':e}</button>`;}).join('');
  const views=[['dashboard','Dashboard'],['kanban','Kanban'],['clientes','Clientes'],['concilia','🏦 Conciliación'],['cargar','Datos']];
  if(S.user.rol==='admin')views.push(['equipo','Equipo']);

async function moveTo(id,estado){
  $('sheet-bg').classList.add('hidden');

  try{await api('move',{json:{id,estado}});c.estado=estado;render();toast('Movido a «'+EST(estado).t+'»');

}
async function dropCard(ev,estado){
  ev.preventDefault();ev.currentTarget.classList.remove('dragover');

  const c=S.clients.find(x=>x.id==id);

    if(estado==='pago_recibido'){await openClient(id);frmPago();}}
  catch(e){toast(e.message,false);}
}

let q='', sortK='vencido', sortD=-1;
function sortBy(k){

}
function rClientes(){

    return typeof v==='string'&&!isNaN(+v)&&v!==''?+v:(v??'');
  };
  cs=cs.slice().sort((a,b)=>{const x=val(a),y=val(b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'es'))*sortD;});
  const th=(k,t,num)=>`<th class="sortable ${num?'num':''}" onclick="sortBy('${k}')">${t}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`;

      <div class="row" style="justify-content:space-between;gap:6px"><b style="font-size:13.5px">${esc(c.nombre)}</b>${esGrp()?empChip(c.empresa):''}</div>
      <div class="m"><span>Vencido</span><span style="color:${+c.vencido>0?'var(--bad)':'var(--tx2)'};font-weight:700">${money(c.vencido)}</span></div>
      <div class="m"><span>Total · ${c.num_facturas} fact.</span><span>${money(c.saldo_total)}</span></div>
      <div class="m"><span><span class="pill" style="background:${EST(c.estado).c}22;color:${EST(c.estado).c}">${EST(c.estado).t}</span></span><span>${+c.max_dias>0?'<span class="dias-bad">'+c.max_dias+' días</span>':''}</span></div>
      <div class="m"><span>${esc((c.gestor_nombre||'Sin gestor').split(' ')[0])}</span><span>${c.ultima_accion?'Últ. acción '+(c.ultima_accion||'').substring(5,10):'Sin gestión'}</span></div>
    </div>`).join('')||'<p class="muted">Sin resultados.</p>'}
  </div>
  <div class="card desk-only" style="padding:0;overflow-x:auto"><table>
    <tr>${th('nombre','Cliente')}${esGrp()?th('empresa','Emp.'):''}${th('nit','NIT')}${th('saldo_total','Total',1)}${th('vencido','Vencido',1)}${th('max_dias','Días',1)}${th('estado','Estado')}${th('gestor_nombre','Gestor')}${th('ultima_accion','Últ. acción')}<th>Contacto</th></tr>

      <td><b>${esc(c.nombre)}</b></td>${esGrp()?`<td>${empChip(c.empresa)}</td>`:''}<td class="muted">${esc(c.nit)}</td>

      <td><span class="pill" style="background:${EST(c.estado).c}22;color:${EST(c.estado).c}">${EST(c.estado).t}</span></td>
      <td class="muted">${esc((c.gestor_nombre||'—').split(' ')[0])}</td>
      <td class="muted">${c.ultima_accion?(c.ultima_accion||'').substring(0,10):'—'}</td>
      <td>${c.telefono?'📞':''}${c.email?' ✉️':''}</td></tr>`).join('')}

  $('p-tot').textContent=money(tot);$('p-neto').textContent=money(neto);
  $('p-neto').style.color=neto<0?'var(--bad)':'var(--ok)';
}

// motor de cruce: exacto / con retenciones (0-10%) / por nombre-NIT
function matchMovs(movs){
  const byC={};CN.invoices.forEach(i=>{(byC[i.client_id]=byC[i.client_id]||[]).push(i);});
  Object.values(byC).forEach(a=>a.sort((x,y)=>(x.fecha_venc||'').localeCompare(y.fecha_venc||'')));
  const norm=s=>(s||'').toString().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const STOP=['SAS','LTDA','GROUP','GRUPO','COLOMBIA','DISTRIBUCIONES','INVERSIONES','COMERCIALIZADORA','CONSTRUCCION','SERVICIOS'];
  const out={};
  movs.forEach(m=>{
    const v=+m.valor, desc=norm(m.descripcion+' '+m.referencia);
    let best=null;
    const push=(client_id,inv,ret,tipo,score)=>{if(!best||score>best.score)best={client_id,inv,ret,tipo,score};};
    for(const cid in byC){
      const c=S.clients.find(x=>x.id==cid);if(!c)continue;
      const toks=norm(c.nombre).split(/\s+/).filter(t=>t.length>3&&!STOP.includes(t));
      const nitDig=(c.nit||'').replace(/\D/g,'');
      const nameHit=(toks.length&&toks.slice(0,2).every(t=>desc.includes(t)))||(nitDig.length>=8&&desc.includes(nitDig.slice(0,9)));
      const inv=byC[cid];
      for(const i of inv)if(Math.abs(+i.saldo-v)<=2)push(cid,[i],0,'exacta',100+(nameHit?30:0));
      let sum=0;const pick=[];
      for(const i of inv){
        sum+=+i.saldo;pick.push(i);
        if(pick.length>1&&Math.abs(sum-v)<=2){push(cid,[...pick],0,'exacta',95+(nameHit?30:0));break;}
        if(v<sum-2&&v>=sum*0.88){
          const ratio=(sum-v)/sum;
          // con nombre: cualquier retención 0-12%; sin nombre: máx 3 facturas y % típico de retención (1.5%-7%)
          if(nameHit)push(cid,[...pick],Math.round(sum-v),'retenciones',85);
          else if(pick.length<=3&&(Math.abs(ratio-0.025)<=0.002||Math.abs(ratio-0.035)<=0.002))push(cid,[...pick],Math.round(sum-v),'retenciones',40);
        }
        if(sum>v*1.15)break;
      }
      if(nameHit)push(cid,[],0,'nombre',50);
    }
    if(best&&best.score>=40)out[m.id]=best;
  });
  return out;
}

function numCol(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/[^0-9.,\-]/g,'');
  if(!s)return 0;
  if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.includes(','))s=(s.split(',')[1]||'').length===2?s.replace(',','.'):s.replace(/,/g,'');
  return parseFloat(s)||0;
}
function dateCol(v){
  if(v instanceof Date){const p=n=>String(n).padStart(2,'0');return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());}
  const s=String(v??'').trim();
  let m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(typeof v==='number'&&v>25569)return new Date((v-25569)*86400000).toISOString().substring(0,10);
  return '';
}

function parseFile(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames.includes('Datos')?'Datos':wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
      let hi=raw.findIndex(r=>r&&r.some(c=>String(c).trim()==='Código SN')&&r.some(c=>String(c).trim()==='Nit'));
      if(hi<0)throw new Error('No encuentro la fila de encabezados («Código SN», «Nit»…). ¿Es el export correcto del ERP?');
      const H=raw[hi].map(c=>String(c??'').trim());
      const col=n=>H.findIndex(h=>h===n);
      const M={codigo:col('Código SN'),nombre:col('Nombre SN'),nit:col('Nit'),grupo:col('Grupo'),municipio:col('Municipio'),documento:col('Documento'),referencia:col('No. referencia'),vendedor:col('Empleado ventas / compras'),condicion:col('Condicion pago documento'),fecha_venc:col('Fecha vencimiento'),fecha_doc:col('Fecha documento'),limite:col('Límite crédito'),importe:col('Importe original'),saldo:col('Saldo')};
      if(M.nit<0||M.documento<0||M.saldo<0)throw new Error('Faltan columnas obligatorias (Nit / Documento / Saldo)');
      const dt=v=>{if(v instanceof Date){const p=n=>String(n).padStart(2,'0');return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate());}return v?String(v):'';};
      const num=v=>typeof v==='number'?v:parseFloat(String(v??'').replace(/[^0-9.\-]/g,''))||0;
      const rows=[];
      for(let i=hi+1;i<raw.length;i++){
        const r=raw[i];if(!r)continue;
        const nit=String(r[M.nit]??'').trim(), doc=String(r[M.documento]??'').trim();
        if(!nit||!doc)continue;
        rows.push({codigo:String(r[M.codigo]??'').trim(),nombre:String(r[M.nombre]??'').trim(),nit,grupo:String(r[M.grupo]??'').trim(),municipio:String(r[M.municipio]??'').trim(),documento:doc,referencia:String(r[M.referencia]??'').trim(),vendedor:String(r[M.vendedor]??'').trim(),condicion:String(r[M.condicion]??'').trim(),fecha_venc:dt(r[M.fecha_venc]),fecha_doc:dt(r[M.fecha_doc]),limite:num(r[M.limite]),importe:num(r[M.importe]),saldo:num(r[M.saldo])});
      }
      if(!rows.length)throw new Error('El archivo no trae filas con NIT y factura');
      parsed={filename:file.name,rows};
      const tot=rows.reduce((a,r)=>a+r.saldo,0), nc=new Set(rows.map(r=>r.nit)).size;
      $('up-preview').innerHTML=`<div class="tl-item"><b>${esc(file.name)}</b><br>
        ${rows.length} facturas · ${nc} clientes · Saldo total <b>${money(tot)}</b><br><br>
        <button class="btn" onclick="confirmUpload()">Confirmar y cargar a ${S.emp}</button></div>`;
    }catch(err){parsed=null;$('up-preview').innerHTML=`<div class="tl-item" style="border-color:var(--bad)">⚠️ ${esc(err.message)}</div>`;}
  };
  rd.readAsArrayBuffer(file);
}
async function confirmUpload(){
  if(!parsed)return;
  $('up-preview').innerHTML='<p class="muted">Procesando…</p>';
  try{
    const d=await api('upload',{json:{empresa:S.emp,fecha_corte:$('up-corte').value,filename:parsed.filename,rows:parsed.rows}});
    toast(`Cargadas ${d.facturas} facturas · vencido ${money(d.vencido)}`);
    parsed=null;await refresh();setView('kanban');
  }catch(e){$('up-preview').innerHTML=`<div class="tl-item" style="border-color:var(--bad)">⚠️ ${esc(e.message)}</div>`;}
}

// ---------- Equipo ----------
function rEquipo(){
  $('view').innerHTML=`
  <h2 style="margin:6px 0 14px">Equipo de cartera</h2>
  <div class="grid" style="grid-template-columns:1.3fr 1fr;align-items:start">
    <div class="card" style="padding:0;overflow-x:auto"><table>
      <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Empresa</th><th>Activo</th><th></th></tr>
      ${S.users.map((u,i)=>`<tr><td><b>${esc(u.nombre)}</b></td><td class="muted">${esc(u.email)}</td><td>${u.rol}</td><td>${u.empresa}</td><td>${+u.activo?'✅':'⛔️'}</td>
      <td><button class="btn2 mini" onclick="editUser(S.users[${i}])">Editar</button></td></tr>`).join('')}</table></div>
    <div class="card" id="user-form">${userFormHTML({})}</div>
  </div>`;
}
function userFormHTML(u){
  return `<h3 class="sec-title">${u.id?'Editar':'Nuevo'} usuario</h3>
  <div class="formgrid">
    <input type="hidden" id="uf-id" value="${u.id||''}">
    <div><label class="f">Nombre</label><input id="uf-nombre" value="${esc(u.nombre||'')}"></div>
    <div><label class="f">Correo</label><input id="uf-email" value="${esc(u.email||'')}"></div>
    <div><label class="f">Rol</label><select id="uf-rol"><option value="gestor" ${u.rol==='gestor'?'selected':''}>Gestor</option><option value="admin" ${u.rol==='admin'?'selected':''}>Administrador</option></select></div>
    <div><label class="f">Empresa</label><select id="uf-emp"><option value="SGX" ${u.empresa==='SGX'?'selected':''}>Solo SGX</option><option value="SDC" ${u.empresa==='SDC'?'selected':''}>Solo SDC</option><option value="ALL" ${(!u.empresa||u.empresa==='ALL')?'selected':''}>Ambas</option></select></div>
    <div><label class="f">Contraseña ${u.id?'(vacío = no cambia)':''}</label><input id="uf-pass" type="password" autocomplete="new-password"></div>
    <div><label class="f">Activo</label><select id="uf-act"><option value="1" ${+u.activo!==0?'selected':''}>Sí</option><option value="0" ${+u.activo===0?'selected':''}>No</option></select></div>
    <div class="full row"><button class="btn" onclick="saveUser()">Guardar</button>${u.id?'<button class="btn2" onclick="rEquipo()">Cancelar</button>':''}</div>
  </div>`;
}
function editUser(u){$('user-form').innerHTML=userFormHTML(u);}
async function saveUser(){
  try{
    await api('user_save',{json:{id:$('uf-id').value||0,nombre:$('uf-nombre').value,email:$('uf-email').value,rol:$('uf-rol').value,empresa:$('uf-emp').value,pass:$('uf-pass').value,activo:$('uf-act').value}});
    toast('Usuario guardado');await refresh();
  }catch(e){toast(e.message,false);}
}
function openPass(){
  $('modal').innerHTML=`<button class="close" onclick="closeModal()">✕</button><h2 style="margin-bottom:14px">Cambiar mi contraseña</h2>
  <div class="formgrid" style="max-width:380px">
    <div class="full"><label class="f">Contraseña actual</label><input id="p-old" type="password"></div>
    <div class="full"><label class="f">Nueva contraseña (mín. 8)</label><input id="p-new" type="password"></div>
    <div class="full"><button class="btn" onclick="doPass()">Cambiar</button></div></div>`;
  $('modal-bg').classList.remove('hidden');
}
async function doPass(){
  try{await api('passwd',{json:{old:$('p-old').value,new:$('p-new').value}});toast('Contraseña actualizada');closeModal();}
  catch(e){toast(e.message,false);}
}

// ---------- Arranque ----------
if(S.token)boot().catch(()=>logout(false));
</script>
</body>
</html>
