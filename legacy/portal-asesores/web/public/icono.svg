<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cartera SEGUREX">
  <!-- Naranja de marca SEGUREX (255,103,31). Las tres barras son el grafico
       de antiguedad que el asesor ve al abrir la aplicacion. -->
