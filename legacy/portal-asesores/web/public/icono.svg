  <g fill="#FFFFFF">
    <rect x="104" y="150" width="304" height="44" rx="22"/>
    <rect x="104" y="234" width="212" height="44" rx="22"/>
    <rect x="104" y="318" width="124" height="44" rx="22"/>
  </g>
</svg>
